release: light-2509-fornax

paths:
  decfiles_cocktail: decfiles/cocktail
  decfiles_gap_modes: decfiles/gap_modes
  output: output
  figures: figures

# LSF queue for every --submit (h: 4 GB/slot, max 12 slots; s: larger, often more pending jobs)
batch:
  queue: s

generation:
