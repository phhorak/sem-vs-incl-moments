    - Bplus/Dst0pizpizenu/Dp1
    - Bplus/Dst0pizpizenu/D0st
    - Bplus/DsstkKenu
    - Bplus/DsKenu
    - Bplus/D0etaenu
    - Bplus/Dst0etaenu
    # B+, muon
    - Bplus/Dstmunu
    - Bplus/Dmunu
    - Bplus/D1munu
    - Bplus/D0stmunu
    - Bplus/Dp1munu
    - Bplus/D2stmunu
    - Bplus/Dstmpimunu
    - Bplus/Dst0pi0munu
    - Bplus/Dmpimunu
    - Bplus/D0pi0munu
    - Bplus/D0pipipmunu/Dp1
    - Bplus/D0pipipmunu/D0st
    - Bplus/Dmpipizmunu/Dp1
    - Bplus/Dmpipizmunu/D0st
    - Bplus/D0pizpizmunu/Dp1
    - Bplus/D0pizpizmunu/D0st
    - Bplus/Dst0pipipmunu/Dp1
    - Bplus/Dst0pipipmunu/D0st
    - Bplus/Dstmpipizmunu/Dp1
    - Bplus/Dstmpipizmunu/D0st
    - Bplus/Dst0pizpizmunu/Dp1
