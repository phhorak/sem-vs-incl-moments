  # it, D'_1 widths differ between releases (314 vs 384 MeV in 08-02-05; MCAmbulance assumes 314), and
  # 08-02-05 segfaults in findMCDecay on B0 with VSS_BMIX. Steps 2+ run in light-2509-fornax.
  n_events_per_job: 200000
  n_jobs: 1
  batch_output_dir: /ghi/fs01/belle2/bdata/users/phorak/sigmc/evtgen
  cocktail_modes:
    # B+, electron
    - Bplus/Dstenu
