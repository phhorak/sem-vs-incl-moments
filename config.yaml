digitize:
  dsk_plot: inputs/digitize_plots/dsk.png
  dsk_x_min: 2.35
  dsk_x_max: 5.4
  dsk_y_min: 0.0
  dsk_y_max: 152
  lambdac_plot: inputs/digitize_plots/lambdac_p.png
  lambdac_x_min: 3.2
  lambdac_x_max: 4.6
  lambdac_y_min: -4
  lambdac_y_max: 76

reweight:
  bf_gap: 0.018       # total branching-fraction budget for all gap modes
  lcp_mass_max: 4.6
  lcp_nbins: 40
  lcp_max_ratio: 10.0
  # one job per cocktail ROOT file; more files per job exceed the 4 GB slot
  cocktail_n_jobs: 76

average:
  method: polynomial        # "gls": free value per (key, cut); "polynomial": smooth in the cut
  poly_degree: {mx: 4, el: 4, q2: 5}  # per family (int = same for all). q2 is Belle II only: chi2 82/30 at deg 4, 21/27 at deg 5
  corr_same_exp_same_var: 0.5
  corr_same_exp_diff_var: 0.2
  corr_diff_exp: 0.05
  inflate_if_incompatible: true
  exclude_sem: true        # if true, drop CDF and DELPHI (sum-of-exclusive measurements)
  exclude_experiments:
    #- delphi
    #- cleo
    #- cdf
  # Belle q2 is offset from Belle II by ~1 sigma per point, beyond their measured correlation
  # (chi2/dof 999/141 with both, 110/96 without).
  exclude_family_experiments:
    q2: [belle]

plots:
  exp_data_tar: inputs/sem.tar.gz
  n_toys: 5
  toy_seed: 42
  el_cuts_min: 0.0
  el_cuts_max: 1.7
  el_cuts_n: 35
  q2_cuts_min: 0.0
  q2_cuts_max: 10.0
  q2_cuts_n: 45
  n_bootstrap: 3
  weight_col: total_weight


# ── Steps 6-8: residual moments, toys, MaxEnt ───────────────────────────────
maxent:
  grid_size: 2000
  mom_tol: 1.0e-6          # converged <=> max_k |m_k(f) - m_k| < mom_tol
  n_moments: [1, 2, 3, 4]  # N = highest moment order used, m_1..m_N (m_0 = 1 always)
  n_moments_extended: [1, 2, 3, 4, 5, 6]   # extra step-7 figure set (total band only)
  # Endpoint priors f(t) ~ t^alpha (1-t)^beta (draft, sec. idea+approach).
  # Mx2 lower edge: no statement possible; El: E_l^2 at 0, eps^(3+a) with a=1/2 at the top;
  # q2: finite at 0, eps^(3/2) at the top.
  alpha: {mx2: 0, el: 2, q2: 0}
  beta:  {mx2: 0, el: 3.5, q2: 1.5}

toys:
  n_toys: 2000
  n_chunks: 40
  seed: 1

systematics:
  # 2*B(B+ -> Xc l nu) + 2*B(B0 -> Xc l nu): a bookkeeping sum over the four cocktail species
  # (B+/B0 x e/mu), not a branching fraction. Only ratios such as B_gap/B_incl enter.
  # HFLAV 2023 (arXiv:2411.18639).
  bf_incl: 0.4264
  # Gap uncertainty per species and lepton (draft Table 1). Applied fully correlated, see
  # lib/systematics.bf_gap_sigma.
  n_leptons: 2
  bf_gap_unc: {Bp: 0.0028, B0: 0.0026}

asimov:
  truth_smoothing: {mx: 0.03, el: 0.12, q2: 0.6}   # Gaussian kernel of the drawn truth [GeV, GeV, GeV^2]
  scenarios:
    Dp1DstEta:
      components:
        - {legend: '$D_1^\prime\to D^*\eta$', fraction: 1.0, gap_mode: Dp1DstEta}
    Dlnu_LcPenu:
      equal_species: true   # each component's B species share its fraction equally
      components:           # `decays` are taken from the SEM cocktail
        - {legend: '$D\ell\nu$', fraction: 0.5, decays: [B0_Denu, Bp_Denu]}
        - {legend: '$\Lambda_c\bar p\,\ell\nu$', fraction: 0.5, gap_mode: LcPenu}
      mx_display: [1.65, 5.3]

data:
  # Mx2 upper edge from the support scan; q2 upper edge = (M_B - M_D)^2
  support: {mx2: [3.2, 16.0], el: [0.0, 2.3], q2: [0.0, 11.7]}
  joint_fit_q2_lo: 1.5     # lowest measured q2 threshold; no data constrain the fit below it
